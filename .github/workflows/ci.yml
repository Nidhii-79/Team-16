name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server - install and test
        working-directory: server
        run: |
          npm install
          npm test
      - name: Client - install and build
        working-directory: client
        run: |
          npm install
          npm run build
